<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Profile — Taska</title>
  <link rel="stylesheet" href="../Dashboard/Styles/styles.css?v=10">
  <style>
    .mono { font-family: 'JetBrains Mono', 'Courier New', monospace; }
    
    body {
      background: var(--bg);
      display: flex;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 0;
    }

    .profile-container {
      width: 100%;
      max-width: 700px;
      padding: 20px;
    }

    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 12px;
      color: var(--body);
      background: transparent;
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      cursor: pointer;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.9rem;
      margin-bottom: 24px;
      transition: background 0.2s;
    }
    .back-btn:hover { background: var(--surface); }

    .profile-card {
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: var(--radius-md);
      padding: 30px;
      box-shadow: var(--shadow-sm);
      margin-bottom: 24px;
      text-align: center;
    }

    .profile-card img, .profile-avatar-placeholder {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid var(--green-700);
      margin: 0 auto 16px auto;
    }

    .profile-avatar-placeholder {
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.5rem;
      font-weight: 800;
      background: var(--green-100);
      color: var(--green-800);
    }

    .profile-name { font-size: 1.6rem; margin: 0 0 4px 0; color: var(--heading); }
    .profile-username { font-size: 0.95rem; color: var(--muted); margin-bottom: 16px; }

    .profile-badges {
      display: flex;
      gap: 8px;
      justify-content: center;
      flex-wrap: wrap;
      margin-bottom: 24px;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 0.8rem;
      font-weight: 600;
      background: var(--surface);
      border: 1px solid var(--line);
    }
    .badge.verified { color: var(--green-700); border-color: var(--green-200); background: var(--green-50); }
    .badge.rating { color: #f59e0b; border-color: #fef3c7; background: #fffbeb; }

    .profile-bio {
      font-size: 0.95rem;
      color: var(--ink-soft);
      line-height: 1.6;
      max-width: 500px;
      margin: 0 auto 24px auto;
    }

    .reviews-section {
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: var(--radius-md);
      padding: 30px;
      box-shadow: var(--shadow-sm);
    }

    .reviews-section h3 { margin-top: 0; margin-bottom: 20px; font-size: 1.2rem; }

    .review-item {
      padding: 16px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      margin-bottom: 12px;
    }
    .review-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
    .review-name { font-weight: 600; font-size: 0.9rem; }
    .review-stars { color: #f59e0b; font-size: 0.85rem; }
    .review-text { font-size: 0.9rem; color: var(--ink-soft); margin: 0; line-height: 1.5; }
    .review-date { font-size: 0.75rem; color: var(--muted); margin-top: 8px; text-align: right; }

    /* Leave Review Form */
    .leave-review-form {
      margin-top: 30px;
      padding-top: 24px;
      border-top: 1px dashed var(--line);
    }
  </style>
</head>
<body>

<div class="profile-container">
  <a href="../Dashboard/index.html" class="back-btn">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M19 12H5M12 19l-7-7 7-7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    Back to Dashboard
  </a>

  <div class="profile-card" id="profile-card-container">
    <div style="padding:40px; color:var(--muted);">Loading profile...</div>
  </div>

  <div class="reviews-section" id="reviews-section" style="display:none;">
    <h3>Recent Reviews</h3>
    <div id="reviews-list">
      <div style="padding:20px; text-align:center; color:var(--muted);">Loading reviews...</div>
    </div>

    <form class="leave-review-form" id="leave-review-form" style="display:none;">
      <h4 style="margin:0 0 12px 0;">Leave a review</h4>
      <div class="field-group">
        <label class="field-label">Rating</label>
        <select class="select-input" id="review-rating">
          <option value="5">5 Stars - Excellent</option>
          <option value="4">4 Stars - Very Good</option>
          <option value="3">3 Stars - Good</option>
          <option value="2">2 Stars - Fair</option>
          <option value="1">1 Star - Poor</option>
        </select>
      </div>
      <div class="field-group">
        <label class="field-label">Comment</label>
        <textarea class="text-input" id="review-comment" rows="3" placeholder="Describe your experience working with this user..." required></textarea>
      </div>
      <button type="submit" class="btn btn-primary" id="submit-review-btn">Submit Review</button>
    </form>
  </div>
</div>

<!-- Supabase JS SDK & Cloudinary -->

</body>
</html>
