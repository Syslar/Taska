<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chats & Messages | Taska</title>
  <link rel="stylesheet" href="../../css/styles.css?v=11">
  <link rel="stylesheet" href="../Dashboard/Styles/styles.css?v=11">
  <style>
    .mono { font-family: 'IBM Plex Mono', 'Courier New', monospace; }
  </style>
</head>
<body>

<div class="dashboard-layout">
  <aside class="sidebar" id="sidebar"></aside>

  <main class="main-content">
    <div class="app-header">
      <div>
        <h1>Chats & Messages</h1>
        <p class="sub">Communicate directly with task posters and applicants.</p>
      </div>
    </div>

    <div class="chat-container" style="display:grid; grid-template-columns:280px 1fr; gap:0; background:var(--paper); border:1px solid var(--line); border-radius:var(--radius-md); min-height:560px; overflow:hidden;">
      <!-- Left: Conversations List -->
      <div style="border-right:1px solid var(--line); padding:16px; display:flex; flex-direction:column; background:var(--surface);">
        <div style="font-weight:700; font-size:0.95rem; margin-bottom:12px; color:var(--green-900);">Conversations</div>
        <div id="chat-threads-list" style="display:flex; flex-direction:column; gap:6px; overflow-y:auto; flex:1;">
          <div style="padding:20px; text-align:center; color:var(--muted); font-size:0.85rem;">Loading conversations…</div>
        </div>
      </div>

      <!-- Right: Active Chat Conversation Panel -->
      <div style="display:flex; flex-direction:column; height:100%; min-height:560px;">
        <!-- Chat Header -->
        <div id="chat-header" style="padding:14px 20px; border-bottom:1px solid var(--line); display:flex; align-items:center; gap:12px; background:var(--paper);">
          <div class="sidebar-user-avatar" id="chat-peer-avatar" style="width:40px; height:40px; font-size:1rem;">--</div>
          <div>
            <div style="font-weight:700; font-size:0.95rem;" id="chat-peer-name">Select a conversation</div>
            <div class="mono" style="font-size:0.78rem; color:var(--muted);" id="chat-peer-username">Select a thread on the left to start chatting</div>
          </div>
        </div>

        <!-- Messages List Body -->
        <div id="chat-messages-body" style="flex:1; padding:20px; overflow-y:auto; display:flex; flex-direction:column; gap:12px; background:var(--surface); min-height:380px;">
          <div style="margin:auto; text-align:center; color:var(--muted); font-size:0.9rem;">
            💬 Select or start a conversation with a Tasker or Poster to send messages.
          </div>
        </div>

        <!-- Chat Input Footer -->
        <form id="chat-send-form" style="padding:14px; border-top:1px solid var(--line); display:flex; flex-direction:column; gap:8px; background:var(--paper);">
          <div id="chat-media-preview-wrap" style="display:none; align-items:center; gap:10px; background:var(--surface); padding:8px 12px; border-radius:var(--radius-sm); border:1px solid var(--line);">
            <span id="chat-media-filename" style="font-size:0.82rem; color:var(--ink-soft); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:260px;"></span>
            <button type="button" id="chat-media-remove-btn" style="background:none; border:none; color:var(--red); font-weight:700; cursor:pointer;">✕ Remove</button>
          </div>
          <div style="display:flex; gap:10px; align-items:center;">
            <label for="chatFileInput" style="cursor:pointer; display:inline-flex; align-items:center; justify-content:center; padding:10px; border-radius:var(--radius-sm); border:1px solid var(--line); background:var(--surface); color:var(--ink-soft);" title="Attach image or video (max 5MB)">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M21.44 11.05l-9.19 9.19a6 6 0 01-8.49-8.49l9.19-9.19a4 4 0 015.66 5.66l-9.2 9.19a2 2 0 01-2.83-2.83l8.49-8.48" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </label>
            <input type="file" id="chatFileInput" accept="image/*,video/*" style="display:none;">
            <input class="text-input" type="text" id="chatInputText" placeholder="Type a message..." style="flex:1;">
            <button type="submit" class="btn btn-primary" id="chatSendBtn">Send</button>
          </div>
        </form>
      </div>
    </div>
  </main>
</div>

<!-- Supabase JS SDK & Cloudinary -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../../js/supabase-client.js"></script>

</body>
</html>
