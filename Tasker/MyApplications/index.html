<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Applications — Taska</title>
<link rel="stylesheet" href="../../css/styles.css?v=14">
<link rel="stylesheet" href="../../css/tasker/tasker-my-applications.css?v=14">
<style>
  .task-manage-card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius-md);
    padding: 24px;
    margin-bottom: 20px;
    box-shadow: var(--shadow-sm);
    transition: border-color 0.2s;
  }
  .task-manage-card:hover {
    border-color: var(--mint-150);
  }
  .applicant-card {
    background: var(--paper);
    border: 1px solid var(--line-soft);
    border-radius: var(--radius-sm);
    padding: 16px;
    margin-top: 12px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
  }
  .applicant-info {
    display: flex;
    align-items: center;
    gap: 12px;
    cursor: pointer;
  }
  .applicant-avatar {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    background: var(--mint-150);
    color: var(--green-900);
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 1rem;
    overflow: hidden;
    flex-shrink: 0;
  }
  .applicant-avatar img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  .applicant-actions {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .badge-hired {
    background: var(--mint-100);
    color: var(--green-700);
    font-weight: 700;
    padding: 6px 12px;
    border-radius: var(--radius-pill);
    font-size: 0.8rem;
  }
</style>
</head>
<body>

<div class="dashboard-layout">

  <!-- ============ SIDEBAR ============ -->
  <aside class="sidebar" id="sidebar"></aside>

  <!-- ============ MAIN CONTENT ============ -->
  <main class="main-content" style="padding: 32px 24px;">

    <!-- TOPBAR / HEADER -->
    <div class="app-header">
      <div>
        <h1>My Applications</h1>
        <p class="sub">Track submitted offers, review shortlisted status, and manage active jobs.</p>
      </div>
      <a href="../BrowseTasks/index.html" class="btn btn-primary" style="display:inline-flex; align-items:center; gap:6px;">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/><path d="M21 21L16.5 16.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        Browse Open Tasks
      </a>
    </div>

    <!-- FILTER CHIPS -->
    <div style="display:flex; gap:10px; margin-bottom:24px; flex-wrap:wrap;">
      <button class="chip is-active" data-filter="ALL" id="filter-all">All Applications</button>
      <button class="chip" data-filter="OPEN" id="filter-open">Pending Bids</button>
      <button class="chip" data-filter="ASSIGNED" id="filter-assigned">Shortlisted / Active Jobs</button>
      <button class="chip" data-filter="COMPLETED" id="filter-completed">Completed Tasks</button>
    </div>

    <!-- TASKS LIST CONTAINER -->
    <div id="my-tasks-list">
      <div style="padding:40px; text-align:center; color:var(--muted);">Loading your submitted applications…</div>
    </div>

  </main>
</div>

<!-- ============ SUBMIT WORK MODAL ============ -->
<div class="modal-overlay" id="submitWorkModal" style="display:none;">
  <div class="modal" style="max-width:480px;">
    <button class="modal-close" id="closeSubmitWorkBtn">✕</button>
    <div style="display:flex; align-items:center; gap:12px; margin-bottom:16px;">
      <div style="width:44px; height:44px; border-radius:50%; background:var(--mint-100); color:var(--green-700); display:flex; align-items:center; justify-content:center; flex-shrink:0;">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
      </div>
      <div>
        <h2 style="font-size:1.2rem; color:var(--green-900); margin:0;">Submit Completed Work</h2>
        <p style="color:var(--muted); font-size:0.84rem; margin:2px 0 0;">Notify the poster to review and release payout</p>
      </div>
    </div>

    <p style="color:var(--ink-soft); font-size:0.9rem; line-height:1.5; margin-bottom:18px;" id="submitWorkTaskTitleText">
      You are marking this task as finished.
    </p>

    <div class="field-group" style="margin-bottom:20px;">
      <label class="field-label" for="workProofNotes">Completion Notes / Deliverable Summary (Optional)</label>
      <textarea class="textarea-input" id="workProofNotes" rows="3" placeholder="Briefly describe what you completed or provide links/proof..."></textarea>
    </div>

    <div style="display:flex; gap:10px; justify-content:flex-end;">
      <button type="button" class="btn btn-secondary" id="cancelSubmitWorkBtn">Cancel</button>
      <button type="button" class="btn btn-primary" id="confirmSubmitWorkBtn">Submit for Poster Approval</button>
    </div>
  </div>
</div>

<!-- SDKs & Scripts -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../../js/supabase-client.js?v=15"></script>
<script src="../../js/sidebar-component.js?v=15"></script>
<script src="../../js/auth-guard.js?v=15"></script>
<script src="../../js/tasker/tasker-my-applications.js?v=15"></script>

  type="text/javascript">
</script>

</body>
</html>
