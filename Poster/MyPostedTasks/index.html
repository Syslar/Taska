<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Posted Tasks — Taska</title>
<link rel="stylesheet" href="../../css/styles.css?v=14">
<link rel="stylesheet" href="../../css/poster/poster-my-tasks.css?v=14">
<style>
  .task-manage-card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius-md);
    padding: 24px;
    margin-bottom: 20px;
    box-shadow: var(--shadow-sm);
    transition: border-color 0.2s;
  }
  .task-manage-card:hover {
    border-color: var(--mint-150);
  }
  .applicant-card {
    background: var(--paper);
    border: 1px solid var(--line-soft);
    border-radius: var(--radius-sm);
    padding: 16px;
    margin-top: 12px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
  }
  .applicant-info {
    display: flex;
    align-items: center;
    gap: 12px;
    cursor: pointer;
  }
  .applicant-avatar {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    background: var(--mint-150);
    color: var(--green-900);
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 1rem;
    overflow: hidden;
    flex-shrink: 0;
  }
  .applicant-avatar img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  .applicant-actions {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .badge-hired {
    background: var(--mint-100);
    color: var(--green-700);
    font-weight: 700;
    padding: 6px 12px;
    border-radius: var(--radius-pill);
    font-size: 0.8rem;
  }
</style>
</head>
<body>

<div class="dashboard-layout">

  <!-- ============ SIDEBAR ============ -->
  <aside class="sidebar" id="sidebar"></aside>

  <!-- ============ MAIN CONTENT ============ -->
  <main class="main-content" style="padding: 32px 24px;">

    <!-- TOPBAR / HEADER -->
    <div class="app-header">
      <div>
        <h1>My Posted Tasks</h1>
        <p class="sub">Manage your tasks, track progress, and review interested Taskers.</p>
      </div>
      <a href="../PostTask/index.html" class="btn btn-primary">+ Post a New Task</a>
    </div>

    <!-- FILTER CHIPS -->
    <div style="display:flex; gap:10px; margin-bottom:24px; flex-wrap:wrap;">
      <button class="chip is-active" data-filter="ALL" id="filter-all">All Tasks</button>
      <button class="chip" data-filter="OPEN" id="filter-open">Open</button>
      <button class="chip" data-filter="ASSIGNED" id="filter-assigned">Assigned / In Progress</button>
      <button class="chip" data-filter="COMPLETED" id="filter-completed">Completed</button>
    </div>

    <!-- TASKS LIST CONTAINER -->
    <div id="my-tasks-list">
      <div style="padding:40px; text-align:center; color:var(--muted);">Loading your posted tasks…</div>
    </div>

  </main>
</div>

<!-- SDKs & Scripts -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../../js/supabase-client.js"></script>
<script src="../../js/main.js"></script>
<script src="../../js/sidebar-component.js"></script>
<script src="../../js/auth-guard.js?v=14"></script>
<script src="../../js/poster/poster-my-tasks.js?v=14"></script>

</body>
</html>
