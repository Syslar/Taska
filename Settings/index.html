<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Settings | Taska</title>
  <link rel="stylesheet" href="../css/styles.css?v=14">
  <style>
    .mono { font-family: 'IBM Plex Mono', 'Courier New', monospace; }
  </style>
</head>
<body>

<div class="dashboard-layout">
  <aside class="sidebar" id="sidebar"></aside>

  <main class="main-content">
    <div class="app-header">
      <div>
        <h1>Settings</h1>
        <p class="sub">Manage your profile card, account preferences, and identity verification.</p>
      </div>
    </div>

    <!-- Settings Sub-Navigation Bar -->
    <div style="display:flex; gap:12px; margin-bottom:24px; border-bottom:1px solid var(--line); padding-bottom:12px;">
      <a href="index.html" class="btn btn-sm btn-secondary is-active" style="border-radius:20px; text-decoration:none;">Profile Details</a>
      <a href="account.html" class="btn btn-sm btn-secondary" style="border-radius:20px; text-decoration:none;">Account & Security</a>
      <a href="kyc.html" class="btn btn-sm btn-secondary" style="border-radius:20px; text-decoration:none;">Identity Verification (KYC)</a>
    </div>

    <!-- SUBTAB 1: PROFILE & IDENTITY -->
    <div class="settings-subpanel" id="settings-subpanel-profile">
      
      <!-- Identity & KYC Verification Banner -->
      <div id="settings-kyc-section" style="margin-bottom: 24px;"></div>

      <!-- Unified Profile Module: Live preview and edit in the same module -->
      <div class="panel" style="max-width: 860px; padding: 32px;">
        
        <!-- Live Profile Header Preview -->
        <div style="display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 20px; padding-bottom: 24px; border-bottom: 1px solid var(--line-soft); margin-bottom: 26px;">
          <div style="display: flex; align-items: center; gap: 20px;">
            <div style="position: relative; width: 76px; height: 76px; flex-shrink: 0;">
              <div class="sidebar-user-avatar" id="profile-big-avatar" style="width: 76px; height: 76px; font-size: 1.65rem; border: 2px solid var(--green-700); border-radius: 50%; display: flex; align-items: center; justify-content: center; overflow: hidden; background: var(--surface-2); font-weight: 700; color: var(--green-900);">--</div>
              <label for="settingsAvatarUpload" title="Change profile picture" style="position: absolute; bottom: -2px; right: -2px; width: 28px; height: 28px; background: var(--green-700); color: #fff; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; border: 2px solid #fff; box-shadow: var(--shadow-sm); transition: transform 0.15s ease;">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
              </label>
              <input type="file" id="settingsAvatarUpload" accept="image/jpeg,image/png,image/webp" style="display: none;">
            </div>
            <div>
              <div style="display: flex; align-items: center; gap: 10px; flex-wrap: wrap;">
                <h2 id="profile-full-name" style="font-size: 1.3rem; font-weight: 700; color: var(--green-900); margin: 0;">User Profile</h2>
                <span id="profile-verified-val" style="font-size: 0.8rem; font-weight: 600; color: var(--green-700); display: inline-flex; align-items: center; gap: 4px;">
                  <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
                  Verified
                </span>
              </div>
              <div style="display: flex; align-items: center; gap: 10px; margin-top: 5px; flex-wrap: wrap;">
                <span class="mono" id="profile-username-val" style="font-size: 0.86rem; color: var(--muted);">@username</span>
                <span style="color: var(--line);">•</span>
                <span class="badge" id="profile-role-badge" style="font-size: 0.76rem; padding: 3px 10px; border-radius: var(--radius-pill); background: var(--mint-100); color: var(--green-900); font-weight: 600;">Tasker</span>
                <span style="color: var(--line);">•</span>
                <span id="profile-email-val" class="mono" style="font-size: 0.84rem; color: var(--muted);">—</span>
              </div>
            </div>
          </div>
          <div>
            <label for="settingsAvatarUpload" class="btn btn-secondary btn-sm" style="cursor: pointer; border-radius: 20px; font-size: 0.85rem; padding: 8px 16px;">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
              Change Photo
            </label>
          </div>
        </div>

        <!-- Unified Profile Edit Form -->
        <form id="settingsProfileForm">
          <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 18px; margin-bottom: 18px;">
            <div class="field-group">
              <label class="field-label" for="settingsFname">First name</label>
              <input class="text-input" type="text" id="settingsFname" required placeholder="e.g. John">
            </div>
            <div class="field-group">
              <label class="field-label" for="settingsLname">Last name</label>
              <input class="text-input" type="text" id="settingsLname" required placeholder="e.g. Doe">
            </div>
          </div>
          
          <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 18px; margin-bottom: 18px;">
            <div class="field-group">
              <label class="field-label" for="settingsPhone">Phone number</label>
              <div class="phone-input-wrap">
                <span class="phone-prefix">+234</span>
                <input class="text-input phone-prefix-input" type="tel" id="settingsPhone" required placeholder="803 123 4567">
              </div>
            </div>

            <div class="field-group">
              <label class="field-label" for="settingsLocation">Location</label>
              <input class="text-input" type="text" id="settingsLocation" placeholder="e.g. Lekki, Lagos">
            </div>
          </div>

          <div class="field-group" style="margin-bottom: 24px;">
            <label class="field-label" for="settingsBio">Bio & Summary</label>
            <textarea class="text-input" id="settingsBio" rows="3" placeholder="Tell other users and clients about your skills, experience, or what you do..." style="resize: vertical; min-height: 86px; line-height: 1.5;"></textarea>
          </div>

          <!-- Action & Tip Footer -->
          <div style="display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 16px; padding-top: 20px; border-top: 1px solid var(--line-soft);">
            <div style="font-size: 0.84rem; color: var(--muted); display: flex; align-items: center; gap: 6px; max-width: 480px;">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color: var(--green-700); flex-shrink: 0;"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>
              <span>Changes reflect instantly across your public profile card and task applications.</span>
            </div>
            <button type="submit" class="btn btn-primary" id="settingsSaveBtn" style="min-width: 150px;">Save Changes</button>
          </div>
        </form>

      </div>
    </div>

  </main>
</div>

<!-- Supabase JS SDK & Cloudinary & Dojah Widget -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/supabase-client.js"></script>
<script src="../js/cloudinary-upload.js"></script>
<script src="https://widget.dojah.io/widget.js"></script>
<script src="../js/dojah-kyc.js"></script>

  data-clerk-publishable-key="pk_test_bW9kZXN0LXN0dXJnZW9uLTQ1LmNsZXJrLmFjY291bnRzLmRldiQ"

<script src="../js/sidebar-component.js"></script>
<script src="../js/auth-guard.js?v=14"></script>
<script src="../js/settings.js?v=14"></script>

</body>
</html>
